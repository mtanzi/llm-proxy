name: tier-a-automerge

# Enables GitHub's native auto-merge (squash) on PRs labelled "review: tier A".
# GitHub merges only after the required checks on main pass. Never checks out
# or runs PR code. Not a required check.
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tier-a-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable or disable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HAS_LABEL: "${{ contains(github.event.pull_request.labels.*.name, 'review: tier A') }}"
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "PR is from a fork (read-only token): skipping."; exit 0
          fi
          if [ "$HAS_LABEL" != "true" ]; then
            # Only undo auto-merge this workflow enabled. Read the PR state, not the
            # event: the concurrency group can drop a pending "unlabeled" run.
            if ! by=$(gh pr view "$PR" -R "$REPO" --json autoMergeRequest \
                -q '.autoMergeRequest.enabledBy.login // ""'); then
              echo "Cannot read auto-merge state."
              gh pr merge "$PR" -R "$REPO" --disable-auto || true; exit 1
            fi
            case "$by" in
              github-actions|github-actions\[bot\])
                gh pr merge "$PR" -R "$REPO" --disable-auto || true ;;
            esac
            exit 0
          fi
          if ! files=$(gh pr diff "$PR" -R "$REPO" --name-only); then
            echo "Cannot list PR files."
            gh pr merge "$PR" -R "$REPO" --disable-auto || true; exit 1
          fi
          bad=$(printf '%s\n' "$files" \
            | grep -vE '^(docs/|testdata/|.*\.md$|.*_test\.go$|.*\.test\.tsx?$)' || true)
          if [ -n "$bad" ]; then
            echo "Not Tier A, files outside the allowlist:"; echo "$bad"
            gh pr merge "$PR" -R "$REPO" --disable-auto || true; exit 1
          fi
          gh pr merge "$PR" -R "$REPO" --auto --squash
