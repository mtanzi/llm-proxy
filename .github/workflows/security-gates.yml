name: Security gates

# Release gates (issue #85). The release workflow calls this one, and the image
# and binaries jobs need it, so a failed gate stops the release before any image
# is pushed or binary attached. Run it by hand (workflow_dispatch) to check any
# branch without cutting a tag. Three gates, all free and open source:
#   govulncheck  reachable known vulnerabilities in the Go module
#   Trivy        critical and high vulnerabilities in the amd64 image
#   gitleaks     secrets anywhere in the full git history
#
# The scanner steps live in .github/actions/govulncheck and
# .github/actions/trivy-scan, shared with the weekly and pull request scans
# (issue #86). Those two scans pass gitleaks: false: gitleaks stays a release
# gate only, and GitHub secret scanning is the routine secret check.
on:
  workflow_call:
    inputs:
      gitleaks:
        description: Run the gitleaks history scan.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      gitleaks:
        description: Run the gitleaks history scan.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/govulncheck

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/trivy-scan
        with:
          image: spyglass:release-check
          build: "true"

  secrets:
    name: gitleaks
    if: ${{ inputs.gitleaks }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release checksums.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action, which needs a license for organisations.
      - name: Install gitleaks
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      # Exit 1 on any finding. --redact keeps a secret out of the log.
      - name: Scan the full git history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
