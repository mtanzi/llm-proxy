name: dependabot-automerge

# Auto-merges Dependabot PRs that meet the rules in CONTRIBUTING.md ("Review
# tiers"). Eligible PRs get "review: tier A" and GitHub auto-merge (squash);
# GitHub merges only after the required checks on main pass. Other Dependabot
# PRs get "review: tier B" and are left to a human. Never checks out or runs PR
# code. Not a required check. tier-a-automerge skips Dependabot PRs.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Label and enable or disable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          # A dependency is auto-mergeable when it is a patch update, or a minor
          # update of a development dependency or of a GitHub Action. Anything
          # else (runtime minor, major, unknown or missing type) is not. An
          # empty or invalid list is not eligible either.
          if eligible=$(printf '%s' "$DEPS" | jq -e '
              type == "array" and length > 0 and all(.[];
                .updateType == "version-update:semver-patch"
                or (.updateType == "version-update:semver-minor"
                    and (.dependencyType == "direct:development"
                         or .packageEcosystem == "github_actions")))'); then
            :
          else
            eligible=false
          fi
          if [ "$eligible" = "true" ]; then
            add="review: tier A"; remove="review: tier B"
          else
            add="review: tier B"; remove="review: tier A"
          fi
          gh pr edit "$PR" -R "$REPO" --add-label "$add" --remove-label "$remove"
          if [ "$eligible" = "true" ]; then
            gh pr merge "$PR" -R "$REPO" --auto --squash --match-head-commit "$HEAD_SHA"
          else
            echo "Not auto-merging: needs human review (tier B)."
          fi
