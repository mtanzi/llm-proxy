version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      # Keep in sync with scripts/check-imports.sh.
      rules:
        core:
          list-mode: strict
          files:
            - "**/internal/core/**"
          allow:
            - $gostd
        family:
          list-mode: strict
          files:
            - "**/internal/family/**"
          allow:
            - $gostd
            - github.com/mtanzi/llm-proxy/internal/core
            - github.com/tidwall/gjson
        application:
          files:
            - "**/internal/recorder/**"
            - "**/internal/keyring/**"
            - "**/internal/api/**"
          deny:
            - pkg: github.com/mtanzi/llm-proxy/internal/store
              desc: only cmd/llm-proxy may import a store package
            - pkg: database/sql
              desc: no database access outside store/postgres
            - pkg: github.com/jackc
              desc: no database driver outside store/postgres
            - pkg: github.com/pressly/goose
              desc: no migrations outside store/postgres
        postgres:
          list-mode: strict
          files:
            - "**/internal/store/postgres/**"
          allow:
            - $gostd
            - github.com/mtanzi/llm-proxy/internal/core
            - github.com/jackc/pgx
            - github.com/pressly/goose
        proxy:
          files:
            - "**/internal/proxy/**"
          deny:
            - pkg: github.com/mtanzi/llm-proxy/internal/store
              desc: proxy imports no store package
