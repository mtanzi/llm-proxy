version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        store:
          files:
            - $all
            - "!**/cmd/spyglass/**"
            - "!**/internal/store/postgres/**"
            - "!**/internal/store/storetest/**"
          deny:
            - pkg: github.com/mtanzi/spyglass/internal/store/postgres
              desc: only cmd/spyglass may import store/postgres
            - pkg: database/sql
              desc: no database access outside store/postgres
            - pkg: github.com/jackc
              desc: no database driver outside store/postgres
            - pkg: github.com/pressly/goose
              desc: no migrations outside store/postgres
        test-support:
          files:
            - $all
            - "!$test"
            - "!**/internal/fakeupstream/**"
          deny:
            - pkg: github.com/anthropics/anthropic-sdk-go
              desc: the SDK is a test client only, never in the data path (ADR 0038)
            - pkg: github.com/mtanzi/spyglass/internal/fakeupstream
              desc: the fake upstream is test support (ADR 0038)
        core:
          list-mode: strict
          files:
            - "**/internal/core/**"
            - "!**/internal/core/coretest/**"
          allow:
            - $gostd
        coretest:
          list-mode: strict
          files:
            - "**/internal/core/coretest/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
        family:
          list-mode: strict
          files:
            - "**/internal/family/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
            - github.com/mtanzi/spyglass/internal/core/coretest
            - github.com/tidwall/gjson
        core-only:
          list-mode: strict
          files:
            - "**/internal/keyring/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
            - github.com/mtanzi/spyglass/internal/core/coretest
        recorder:
          list-mode: strict
          files:
            - "**/internal/recorder/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
            - github.com/prometheus/client_golang/prometheus
            - github.com/mtanzi/spyglass/internal/core/coretest
        storetest:
          list-mode: strict
          files:
            - "**/internal/store/storetest/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
            - github.com/mtanzi/spyglass/internal/store/postgres
        config:
          list-mode: strict
          files:
            - "**/internal/config/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
            - github.com/mtanzi/spyglass/internal/core/coretest
            - go.yaml.in/yaml/v3
            - github.com/prometheus/client_golang/prometheus
        ui:
          list-mode: strict
          files:
            - "**/internal/ui/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
            - github.com/mtanzi/spyglass/internal/core/coretest
            - github.com/mtanzi/spyglass/internal/recorder
            - github.com/mtanzi/spyglass/internal/keyring
        postgres:
          list-mode: strict
          files:
            - "**/internal/store/postgres/**"
            - "!$test"
            - "!**/internal/store/postgres/pgtest/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
            - github.com/jackc/pgx
            - github.com/pressly/goose
            - github.com/prometheus/client_golang/prometheus
        postgres-test:
          list-mode: strict
          files:
            - "**/internal/store/postgres/*_test.go"
            - "**/internal/store/postgres/**/*_test.go"
            - "**/internal/store/postgres/pgtest/**"
          allow:
            - $gostd
            - github.com/mtanzi/spyglass/internal/core
            - github.com/mtanzi/spyglass/internal/store/postgres
            - github.com/mtanzi/spyglass/internal/store/storetest
            - github.com/jackc/pgx
            - github.com/pressly/goose
            - github.com/testcontainers/testcontainers-go
        proxy:
          files:
            - "**/internal/proxy/**"
          deny:
            - pkg: github.com/mtanzi/spyglass/internal/store
              desc: proxy imports no store package
