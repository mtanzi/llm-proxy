# Fake Anthropic upstream for the compose tests: one canned, non-streamed reply.
server {
    listen 8080;

    location /v1/messages {
        default_type application/json;
        return 200 '{"id":"msg_compose_test","type":"message","role":"assistant","model":"claude-opus-4-8","content":[{"type":"text","text":"ok"}],"stop_reason":"end_turn","stop_sequence":null,"usage":{"input_tokens":10,"output_tokens":5}}';
    }
}
